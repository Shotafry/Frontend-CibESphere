# Allowlist OSV del frontend - residual aceptado y justificado (0.11.0, 2026-06-20)
#
# Por que existe este fichero:
# El frontend migra de Vite SPA + MUI a Next.js + shadcn/Tailwind (CLAUDE.md 6.1).
# Toda la cadena de build de Vite (vite, esbuild, rollup, babel, postcss y sus
# transitivas) y react-router se ELIMINAN en la Fase 2 (0.16.0-0.20.0). Gastar
# esfuerzo en parchear deps sentenciadas a muerte -sobre todo lidiar con los
# breaking changes de react-router 7.9->7.15- es trabajo tirado. Por eso en la
# 0.11.0 NO se actualizan: se documentan aqui como residual con su release de retirada.
#
# Runtime real saneado en 0.11.0: axios (1.13.2->1.16.0) y su transitiva form-data
# (override ->4.0.6) estan limpios. El backend quedo 100% verde (OSV: No issues found).
#
# IMPORTANTE: cuando la Fase 2 retire Vite/react-router/MUI, estas entradas deben
# BORRARSE (no quedarse "por si acaso"). La CI de 0.14.0 consume este fichero.

